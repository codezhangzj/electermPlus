<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">electermPlus Dock icon</title>
  <desc id="desc">A black terminal window with a command prompt and Plus connection badge on a warm white squircle.</desc>
  <defs>
    <linearGradient id="base" x1="160" y1="100" x2="860" y2="940" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".58" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="terminalBorder" x1="206" y1="230" x2="824" y2="804" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset=".38" stop-color="#4F7DFF"/>
      <stop offset=".72" stop-color="#1ED6F2"/>
      <stop offset="1" stop-color="#5865F2"/>
    </linearGradient>
    <linearGradient id="terminal" x1="268" y1="252" x2="766" y2="770" gradientUnits="userSpaceOnUse">
      <stop stop-color="#222733"/>
      <stop offset=".45" stop-color="#10141D"/>
      <stop offset="1" stop-color="#030509"/>
    </linearGradient>
    <linearGradient id="prompt" x1="310" y1="434" x2="622" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B794FF"/>
      <stop offset=".48" stop-color="#5E8CFF"/>
      <stop offset="1" stop-color="#37D9FF"/>
    </linearGradient>
    <linearGradient id="badge" x1="704" y1="648" x2="852" y2="804" gradientUnits="userSpaceOnUse">
      <stop stop-color="#42E8FF"/>
      <stop offset=".48" stop-color="#4F7DFF"/>
      <stop offset="1" stop-color="#8A5CF6"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="0" cy="0" r="1" gradientTransform="translate(452 500) rotate(35) scale(390 280)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3659A8" stop-opacity=".22"/>
      <stop offset=".66" stop-color="#0B1020" stop-opacity=".08"/>
      <stop offset="1" stop-color="#020306" stop-opacity="0"/>
    </radialGradient>
    <filter id="baseShadow" x="12" y="24" width="1000" height="1000" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#172033" flood-opacity=".20"/>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#base)" filter="url(#baseShadow)"/>
  <rect x="75" y="75" width="874" height="874" rx="209" stroke="white" stroke-opacity=".84" stroke-width="10"/>

  <g>
    <rect x="174" y="220" width="676" height="576" rx="142" fill="url(#terminalBorder)"/>
    <rect x="190" y="236" width="644" height="544" rx="126" fill="url(#terminal)"/>
    <rect x="202" y="248" width="620" height="520" rx="114" stroke="white" stroke-opacity=".10" stroke-width="4"/>
  </g>

  <path d="M236 366H788" stroke="white" stroke-opacity=".10" stroke-width="4"/>
  <circle cx="264" cy="314" r="14" fill="#FF6B6B"/>
  <circle cx="310" cy="314" r="14" fill="#FFD166"/>
  <circle cx="356" cy="314" r="14" fill="#58D68D"/>
  <rect x="396" y="298" width="212" height="32" rx="16" fill="white" fill-opacity=".07"/>

  <rect x="222" y="388" width="580" height="348" rx="78" fill="url(#screenGlow)"/>
  <path d="M312 458L430 554L312 650" stroke="url(#prompt)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M500 650H656" stroke="#F7FAFF" stroke-width="62" stroke-linecap="round"/>

  <path d="M676 466H746C769.196 466 788 484.804 788 508V614" stroke="#46DFFF" stroke-opacity=".72" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="676" cy="466" r="18" fill="#8E70FF"/>
  <circle cx="788" cy="614" r="18" fill="#46DFFF"/>

  <g>
    <circle cx="776" cy="720" r="92" fill="url(#badge)"/>
    <circle cx="776" cy="720" r="82" stroke="white" stroke-opacity=".42" stroke-width="6"/>
    <path d="M776 674V766M730 720H822" stroke="white" stroke-width="34" stroke-linecap="round"/>
  </g>

  <path d="M212 226C298 142 426 120 574 120H738" stroke="white" stroke-opacity=".58" stroke-width="18" stroke-linecap="round"/>
</svg>
