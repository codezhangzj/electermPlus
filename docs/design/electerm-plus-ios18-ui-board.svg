    <linearGradient id="boardBg" x1="0" y1="0" x2="1600" y2="1120">
      <stop offset="0" stop-color="#F7F9FB"/>
      <stop offset="0.52" stop-color="#EEF4F7"/>
      <stop offset="1" stop-color="#F7F4EF"/>
