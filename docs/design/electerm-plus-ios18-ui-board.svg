      .greenText { fill: #21A66A; font-family: Inter, Arial, sans-serif; font-weight: 800; }
      .blueText { fill: #2D88C7; font-family: Inter, Arial, sans-serif; font-weight: 800; }
      .orangeText { fill: #D38422; font-family: Inter, Arial, sans-serif; font-weight: 800; }
