<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 外壳：iOS squircle 金属蓝渐变 -->
    <linearGradient id="shell" x1="160" y1="80" x2="880" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D7BFF"/>
      <stop offset="0.5" stop-color="#2456E8"/>
      <stop offset="1" stop-color="#15309E"/>
    </linearGradient>
    <!-- 外壳顶部光泽 -->
    <linearGradient id="shellGloss" x1="512" y1="64" x2="512" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- 屏幕外框金属感 -->
    <linearGradient id="bezel" x1="200" y1="240" x2="824" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A4256"/>
      <stop offset="0.5" stop-color="#222838"/>
      <stop offset="1" stop-color="#11151F"/>
    </linearGradient>
    <!-- 屏幕玻璃 -->
    <linearGradient id="screen" x1="240" y1="290" x2="784" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10243A"/>
      <stop offset="1" stop-color="#050B14"/>
    </linearGradient>
    <!-- 屏幕反光 -->
    <linearGradient id="screenGlass" x1="240" y1="290" x2="500" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- 提示符发光 -->
    <linearGradient id="prompt" x1="320" y1="380" x2="470" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FE7A4"/>
      <stop offset="1" stop-color="#34C759"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shellShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#091235" flood-opacity="0.4"/>
    </filter>
    <filter id="innerScreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- squircle 外壳 -->
  <path filter="url(#shellShadow)" fill="url(#shell)" d="M512 64
    C 232 64 64 232 64 512 C 64 792 232 960 512 960
    C 792 960 960 792 960 512 C 960 232 792 64 512 64 Z"/>
  <!-- 顶部光泽 -->
  <path fill="url(#shellGloss)" d="M512 64
    C 232 64 64 232 64 512 C 64 556 70 598 80 636
    C 210 548 350 512 512 512 C 674 512 814 548 944 636
    C 954 598 960 556 960 512 C 960 232 792 64 512 64 Z" opacity="0.7"/>

  <!-- 显示器外框（拟物立体边框） -->
  <rect x="176" y="232" width="672" height="492" rx="56" fill="url(#bezel)" filter="url(#innerScreen)"/>
  <rect x="176" y="232" width="672" height="492" rx="56" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="6"/>
  <rect x="184" y="240" width="656" height="476" rx="50" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="4"/>

  <!-- 屏幕玻璃 -->
  <rect x="224" y="280" width="576" height="396" rx="34" fill="url(#screen)"/>
  <!-- 屏幕左上反光 -->
  <rect x="224" y="280" width="576" height="396" rx="34" fill="url(#screenGlass)"/>

  <!-- 顶部三色圆点（保留终端识别，缩小克制） -->
  <circle cx="284" cy="330" r="13" fill="#FF5F57"/>
  <circle cx="324" cy="330" r="13" fill="#FEBC2E"/>
  <circle cx="364" cy="330" r="13" fill="#28C840"/>

  <!-- 终端提示符 > + 发光的 SSH 字样（模拟输入 ssh 命令） -->
  <g filter="url(#glow)">
    <!-- 提示符 > -->
    <path d="M286 446 L356 512 L286 578" stroke="url(#prompt)" stroke-width="42"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- SSH 字样 -->
    <text x="410" y="556" font-family="SF Mono, Menlo, Consolas, 'Courier New', monospace"
          font-size="172" font-weight="700" letter-spacing="6"
          fill="url(#prompt)">SSH</text>
  </g>

  <!-- 底座（拟物支架） -->
  <path d="M452 724 L572 724 L592 792 L432 792 Z" fill="url(#bezel)"/>
  <rect x="372" y="792" width="280" height="34" rx="17" fill="#10141E"/>
  <rect x="372" y="792" width="280" height="14" rx="7" fill="#ffffff" fill-opacity="0.08"/>
</svg>
